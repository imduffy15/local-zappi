<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Zappi</title>
<style>
:root{font-family:system-ui,sans-serif;color:#e6eef8;background:#0b1421;color-scheme:dark}*{box-sizing:border-box}body{margin:0}main{max-width:480px;margin:8vh auto;padding:24px}h1{font-size:24px;margin:0}header{display:flex;align-items:center;justify-content:space-between;gap:16px}#connection{font-size:14px;color:#a9bad0}.card{margin-top:32px;background:#121f30;border:1px solid #26374d;border-radius:20px;padding:28px}h2{font-size:15px;font-weight:400;color:#a9bad0;margin:0}#mode{font-size:42px;font-weight:650;margin:10px 0 30px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{font:inherit;font-weight:600;padding:18px;border:1px solid #3c5471;border-radius:12px;background:#1d3550;color:#e6eef8;cursor:pointer}button:hover:not(:disabled){background:#294a6e}button[aria-pressed=true]{background:#175d48;border-color:#54caa1}button:focus-visible{outline:3px solid #8ce6bf;outline-offset:3px}button:disabled{opacity:.45;cursor:wait}#message{color:#bccadd;font-size:14px;line-height:1.5;min-height:42px;margin:22px 0 0}
</style></head><body><main>
<header><h1>Local Zappi</h1><span id="connection">Connecting…</span></header>
<section class="card" aria-label="Charger controls"><h2>Charging mode</h2><div id="mode" aria-live="polite">—</div>
<div class="buttons"><button data-mode="fast" aria-pressed="false" disabled>Fast</button><button data-mode="eco" aria-pressed="false" disabled>Eco</button><button data-mode="eco_plus" aria-pressed="false" disabled>Eco+</button><button data-mode="stop" aria-pressed="false" disabled>Stop</button></div>
<p id="message" role="status"></p></section>
</main><script src="/dashboard.js" defer></script></body></html>
