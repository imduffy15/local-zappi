<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Zappi</title>
<style>
:root{font-family:system-ui,sans-serif;color:#e6eef8;background:#0b1421;color-scheme:dark}*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:8vh auto;padding:24px}h1{font-size:24px;margin:0}header{display:flex;align-items:center;justify-content:space-between;gap:16px}#connection{font-size:14px;color:#a9bad0}.card{margin-top:32px;background:#121f30;border:1px solid #26374d;border-radius:20px;padding:28px}h2{font-size:15px;font-weight:400;color:#a9bad0;margin:0}#mode{font-size:42px;font-weight:650;margin:10px 0 30px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{font:inherit;font-weight:600;padding:18px;border:1px solid #3c5471;border-radius:12px;background:#1d3550;color:#e6eef8;cursor:pointer}button:hover:not(:disabled){background:#294a6e}button[aria-pressed=true]{background:#175d48;border-color:#54caa1}button:focus-visible{outline:3px solid #8ce6bf;outline-offset:3px}button:disabled{opacity:.45;cursor:wait}#message{color:#bccadd;font-size:14px;line-height:1.5;min-height:42px;margin:22px 0 0}
.power{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px}.power strong{display:block;font-size:28px;margin-top:6px}.power span, label{font-size:14px;color:#a9bad0}.tabs{display:flex;gap:8px;margin:20px 0}.tabs button{padding:10px 14px;font-size:14px}input{font:inherit;color:inherit;background:#0b1421;border:1px solid #3c5471;border-radius:6px;padding:9px;max-width:100%}label{display:block;margin:10px 0}label input{display:block;margin-top:6px}input[type=checkbox]{display:inline;margin:0}.fields{display:flex;gap:16px;flex-wrap:wrap}.timer{border-top:1px solid #26374d;padding:12px 0}.days{display:flex;gap:12px;flex-wrap:wrap}.days label{display:flex;gap:4px;align-items:center}.hidden{display:none!important}#settings-message{font-size:14px;color:#bccadd;line-height:1.5}.small{font-size:13px;color:#a9bad0}.timer h3{font-size:15px;margin:4px 0}
</style></head><body><main>
<header><h1>Local Zappi</h1><span id="connection">Connecting…</span></header>
<div class="power"><div><span id="grid-label">Grid</span><strong id="grid-power">—</strong></div><div><span>Charger</span><strong id="charger-power">—</strong></div></div>
<section class="card" aria-label="Charger controls"><h2>Charging mode</h2><div id="mode" aria-live="polite">—</div>
<div class="buttons"><button data-mode="fast" aria-pressed="false" disabled>Fast</button><button data-mode="eco" aria-pressed="false" disabled>Eco</button><button data-mode="eco_plus" aria-pressed="false" disabled>Eco+</button><button data-mode="stop" aria-pressed="false" disabled>Stop</button></div>
<p id="message" role="status"></p></section>
<section class="card"><h2>Boost</h2>
<div class="tabs" role="tablist" aria-label="Boost settings"><button role="tab" data-tab="manual" aria-selected="true">Manual</button><button role="tab" data-tab="smart" aria-selected="false">Smart</button><button role="tab" data-tab="scheduled" aria-selected="false">Scheduled</button></div>
<div id="manual-panel" role="tabpanel"><label>Energy (kWh)<input id="manual-kwh" type="number" min="1" max="99" value="5"></label><button id="manual-start" data-setting>Start boost</button></div>
<div id="smart-panel" role="tabpanel" class="hidden"><div class="fields"><label>Energy (kWh)<input id="smart-kwh" type="number" min="1" max="99" value="5"></label><label>Ready by<input id="smart-time" type="time" value="07:00"></label></div><button id="smart-start" data-setting>Start smart boost</button></div>
<div id="scheduled-panel" role="tabpanel" class="hidden"><p class="small">Timers run on the charger in its local time. Selecting a tab does not disable saved timers.</p><div id="timers"></div><button id="save-schedules" data-setting>Save schedules</button></div>
<p><button id="cancel-boost" data-setting>Cancel boost</button></p><p id="settings-message" role="status">Loading charger settings…</p>
</section>
</main><script src="/dashboard.js" defer></script></body></html>
